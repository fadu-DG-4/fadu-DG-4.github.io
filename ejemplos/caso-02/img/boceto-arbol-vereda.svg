<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#fbfaf6; font-family:'SF Mono',Consolas,monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eceae0" stroke-width="0.75"/>
    </pattern>
  </defs>
  
  <!-- Cuadrícula técnica de fondo -->
  <rect width="800" height="480" fill="url(#grid)" />
  
  <!-- Marco exterior -->
  <rect x="15" y="15" width="770" height="450" fill="none" stroke="#141414" stroke-width="1"/>
  
  <!-- Cabezal técnico interno -->
  <text x="30" y="42" font-size="11" fill="#141414" font-weight="bold" letter-spacing="1">ESQUICIO TÉCNICO // 01 · ARBOLADO EN ESPACIO URBANO</text>
  <text x="730" y="42" font-size="11" fill="#888" text-anchor="end">[BOCETO PRELIMINAR]</text>
  <line x1="15" y1="52" x2="785" y2="52" stroke="#141414" stroke-width="1"/>
  
  <!-- Línea de suelo / Vereda -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#141414" stroke-width="2"/>
  <text x="60" y="380" font-size="10" fill="#555">NIVEL VEREDA // COTA 0.00</text>
  <line x1="60" y1="360" x2="50" y2="370" stroke="#888" stroke-width="1"/>
  <line x1="80" y1="360" x2="70" y2="370" stroke="#888" stroke-width="1"/>
  <line x1="100" y1="360" x2="90" y2="370" stroke="#888" stroke-width="1"/>
  <line x1="120" y1="360" x2="110" y2="370" stroke="#888" stroke-width="1"/>
  
  <!-- Cantero / Cazuela del árbol -->
  <rect x="330" y="355" width="140" height="10" fill="#eae7dc" stroke="#141414" stroke-width="1"/>
  <text x="400" y="382" font-size="9" fill="#141414" text-anchor="middle">CAZUELA PERMEABLE</text>
  
  <!-- Sistema radicular (Raíces - suelo y retención hídrica) -->
  <!-- Estilo botánico técnico con líneas orgánicas quebradas -->
  <path d="M400,365 C400,390 380,410 340,430 M380,410 C390,425 400,440 405,450 M400,365 C410,395 430,415 470,435 M420,410 C415,425 410,445 425,455 M400,365 L400,445" fill="none" stroke="#141414" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Tronco del árbol -->
  <path d="M385,355 C385,270 375,220 365,190 M415,355 C415,270 425,220 435,190" fill="none" stroke="#141414" stroke-width="2"/>
  <!-- Ramas principales -->
  <path d="M365,190 C340,160 300,150 260,160 M365,190 C370,140 350,110 330,90" fill="none" stroke="#141414" stroke-width="1.5"/>
  <path d="M435,190 C460,160 500,150 540,160 M435,190 C430,140 450,110 470,90" fill="none" stroke="#141414" stroke-width="1.5"/>
  <path d="M400,195 L400,120 M400,150 C380,130 360,120 340,125" fill="none" stroke="#141414" stroke-width="1.5"/>
  
  <!-- Copa del árbol (Contorno técnico botánico punteado y vivo) -->
  <path d="M250,160 C210,140 220,90 270,80 C290,50 350,50 380,70 C410,40 470,50 500,80 C550,80 570,130 540,165 C570,210 520,240 470,230 C450,260 370,260 340,230 C290,250 230,210 250,160 Z" fill="#f4f2e6" fill-opacity="0.6" stroke="#141414" stroke-width="1.25"/>
  
  <!-- Llamada 1: Polinizadores y mariposas -->
  <circle cx="270" cy="110" r="14" fill="#141414"/>
  <text x="270" y="115" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <line x1="256" y1="110" x2="160" y2="110" stroke="#141414" stroke-width="1"/>
  <rect x="70" y="95" width="180" height="42" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <text x="80" y="112" font-size="10" font-weight="bold" fill="#141414">[01] POLINIZADORES</text>
  <text x="80" y="127" font-size="9" fill="#555">Atracción de abejas y mariposas</text>
  
  <!-- Llamada 2: Aves y fauna nativa -->
  <circle cx="510" cy="100" r="14" fill="#141414"/>
  <text x="510" y="105" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <line x1="524" y1="100" x2="620" y2="100" stroke="#141414" stroke-width="1"/>
  <rect x="560" y="85" width="190" height="42" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <text x="570" y="102" font-size="10" font-weight="bold" fill="#141414">[02] FAUNA Y AVES LOCALES</text>
  <text x="570" y="117" font-size="9" fill="#555">Alimento, refugio y nidificación</text>
  
  <!-- Llamada 3: Adaptación hídrica y bajo riego -->
  <circle cx="490" cy="220" r="14" fill="#141414"/>
  <text x="490" y="225" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <line x1="504" y1="220" x2="600" y2="220" stroke="#141414" stroke-width="1"/>
  <rect x="560" y="205" width="190" height="42" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <text x="570" y="222" font-size="10" font-weight="bold" fill="#141414">[03] BAJO MANTENIMIENTO</text>
  <text x="570" y="237" font-size="9" fill="#555">Resistencia hídrica local</text>

  <!-- Llamada 4: Estructura de suelo y absorción -->
  <circle cx="330" cy="425" r="14" fill="#141414"/>
  <text x="330" y="430" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
  <line x1="316" y1="425" x2="220" y2="425" stroke="#141414" stroke-width="1"/>
  <rect x="70" y="410" width="180" height="42" fill="#ffffff" stroke="#141414" stroke-width="1"/>
  <text x="80" y="427" font-size="10" font-weight="bold" fill="#141414">[04] SUELO Y DRENAJE</text>
  <text x="80" y="442" font-size="9" fill="#555">Retención de agua de lluvia</text>

  <!-- Cursor interactivo de diseño (homenaje al póster de referencia) -->
  <polygon points="680,290 695,335 687,338 682,350 673,346 678,334 668,330" fill="#141414"/>
</svg>
