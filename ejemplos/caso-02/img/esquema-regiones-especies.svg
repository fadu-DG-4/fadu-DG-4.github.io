  <g fill="#d0cebd" font-size="8" font-family="'SF Mono',Consolas,monospace" opacity="0.55">
    <text x="10" y="445">. _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ .</text>
    <text x="10" y="455">_ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | .</text>
    <text x="10" y="465">. _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ .</text>
    <text x="10" y="475">_ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | .</text>
    <text x="10" y="485">. _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ .</text>
    <text x="10" y="495">_ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | .</text>
    <text x="10" y="505">. _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ . _ .</text>
    <text x="10" y="515">_ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | . _ . | .</text>
  </g>
</svg>
