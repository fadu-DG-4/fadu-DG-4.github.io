<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="100%" height="100%" style="font-family:'SF Mono',Consolas,monospace;">
  <defs>
    <linearGradient id="humedadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#777770" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d0cebd" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Barra de gradiente de humedad -->
  <text x="10" y="18" font-size="9" font-weight="bold" fill="#141414" letter-spacing="1">GRADIENTE DE HUMEDAD</text>
  <text x="200" y="18" font-size="8" fill="#9e2a2b" font-weight="600">+ NE HÚMEDO</text>
  <text x="760" y="18" font-size="8" fill="#888" text-anchor="end">SO SECO −</text>
  <rect x="10" y="24" width="800" height="10" fill="url(#humedadGrad)" stroke="#141414" stroke-width="1"/>

  <!-- Cruces técnicas decorativas -->
  <text x="0" y="62" font-size="11" fill="#141414" font-weight="bold">+</text>
  <text x="810" y="62" font-size="11" fill="#141414" font-weight="bold" text-anchor="end">+</text>

  <!-- 3 Columnas: encabezados -->
  <rect x="10" y="56" width="240" height="30" fill="#eceae1" stroke="#141414" stroke-width="1"/>
  <text x="22" y="76" font-size="11" font-weight="bold" fill="#141414">01 // REGIÓN</text>

  <rect x="290" y="56" width="240" height="30" fill="#eceae1" stroke="#141414" stroke-width="1"/>
  <text x="302" y="76" font-size="11" font-weight="bold" fill="#141414">02 // ESPECIE NATIVA</text>

  <rect x="570" y="56" width="240" height="30" fill="#eceae1" stroke="#141414" stroke-width="1"/>
  <text x="582" y="76" font-size="11" font-weight="bold" fill="#141414">03 // USO URBANO</text>

  <!-- Fila 1: Selva Paranaense → Lapacho → Avenidas -->
  <rect x="10" y="102" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="22" y="125" font-size="12" fill="#141414" font-weight="600">Selva Paranaense</text>
  <text x="22" y="140" font-size="8" fill="#888">subtropical húmeda</text>

  <rect x="290" y="102" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="302" y="125" font-size="12" fill="#141414" font-weight="600">Lapacho rosado</text>
  <text x="302" y="140" font-size="8" fill="#9e2a2b" font-style="italic">Handroanthus impetiginosus</text>

  <rect x="570" y="102" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="582" y="125" font-size="12" fill="#141414" font-weight="600">Avenidas / Plazas</text>
  <text x="582" y="140" font-size="8" fill="#888">alineación ornamental</text>

  <!-- Flechas fila 1 -->
  <line x1="250" y1="126" x2="282" y2="126" stroke="#141414" stroke-width="1"/>
  <polygon points="290,126 283,122 283,130" fill="#141414"/>
  <line x1="530" y1="126" x2="562" y2="126" stroke="#141414" stroke-width="1"/>
  <polygon points="570,126 563,122 563,130" fill="#141414"/>

  <!-- Ícono hoja (decorativo) entre col 1 y 2 fila 1 -->
  <text x="266" y="130" font-size="10" fill="#9e2a2b">❋</text>

  <!-- Fila 2: Espinal / Pampeana → Ceibo / Tala → Costaneras -->
  <rect x="10" y="168" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="22" y="191" font-size="12" fill="#141414" font-weight="600">Espinal / Pampeana</text>
  <text x="22" y="206" font-size="8" fill="#888">pastizal y bosque bajo</text>

  <rect x="290" y="168" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="302" y="191" font-size="12" fill="#141414" font-weight="600">Ceibo / Tala</text>
  <text x="302" y="206" font-size="8" fill="#9e2a2b" font-style="italic">Erythrina crista-galli / C. tala</text>

  <rect x="570" y="168" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="582" y="191" font-size="12" fill="#141414" font-weight="600">Costaneras / Veredas</text>
  <text x="582" y="206" font-size="8" fill="#888">riberas y arbolado lineal</text>

  <!-- Flechas fila 2 -->
  <line x1="250" y1="192" x2="282" y2="192" stroke="#141414" stroke-width="1"/>
  <polygon points="290,192 283,188 283,196" fill="#141414"/>
  <line x1="530" y1="192" x2="562" y2="192" stroke="#141414" stroke-width="1"/>
  <polygon points="570,192 563,188 563,196" fill="#141414"/>

  <text x="266" y="196" font-size="10" fill="#9e2a2b">❋</text>

  <!-- Fila 3: Chaco / Monte → Algarrobo → Sombra estival -->
  <rect x="10" y="234" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="22" y="257" font-size="12" fill="#141414" font-weight="600">Chaco / Monte árido</text>
  <text x="22" y="272" font-size="8" fill="#888">bosque seco estacional</text>

  <rect x="290" y="234" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="302" y="257" font-size="12" fill="#141414" font-weight="600">Algarrobo blanco/negro</text>
  <text x="302" y="272" font-size="8" fill="#9e2a2b" font-style="italic">Prosopis alba / P. nigra</text>

  <rect x="570" y="234" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="582" y="257" font-size="12" fill="#141414" font-weight="600">Bajo riego / Sombra estival</text>
  <text x="582" y="272" font-size="8" fill="#888">plazas secas, xeriscape</text>

  <!-- Flechas fila 3 -->
  <line x1="250" y1="258" x2="282" y2="258" stroke="#141414" stroke-width="1"/>
  <polygon points="290,258 283,254 283,262" fill="#141414"/>
  <line x1="530" y1="258" x2="562" y2="258" stroke="#141414" stroke-width="1"/>
  <polygon points="570,258 563,254 563,262" fill="#141414"/>

  <text x="266" y="262" font-size="10" fill="#9e2a2b">❋</text>

  <!-- Fila 4: Bosques Patagónicos → Pehuén → Hitos cívicos -->
  <rect x="10" y="300" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="22" y="323" font-size="12" fill="#141414" font-weight="600">Bosques Patagónicos</text>
  <text x="22" y="338" font-size="8" fill="#888">bosque frío andino</text>

  <rect x="290" y="300" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="302" y="323" font-size="12" fill="#141414" font-weight="600">Pehuén (Araucaria)</text>
  <text x="302" y="338" font-size="8" fill="#9e2a2b" font-style="italic">Araucaria araucana</text>

  <rect x="570" y="300" width="240" height="48" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="582" y="323" font-size="12" fill="#141414" font-weight="600">Hitos cívicos / Aislamiento</text>
  <text x="582" y="338" font-size="8" fill="#888">cortinas de viento, parques</text>

  <!-- Flechas fila 4 -->
  <line x1="250" y1="324" x2="282" y2="324" stroke="#141414" stroke-width="1"/>
  <polygon points="290,324 283,320 283,328" fill="#141414"/>
  <line x1="530" y1="324" x2="562" y2="324" stroke="#141414" stroke-width="1"/>
  <polygon points="570,324 563,320 563,328" fill="#141414"/>

  <text x="266" y="328" font-size="10" fill="#9e2a2b">❋</text>

  <!-- Cruces de conexión cruzada (adaptabilidad entre regiones) -->
  <path d="M250,192 C275,192 275,126 290,126" fill="none" stroke="#9e2a2b" stroke-width="0.75" stroke-dasharray="3,2"/>
  <path d="M530,192 C555,192 555,258 570,258" fill="none" stroke="#9e2a2b" stroke-width="0.75" stroke-dasharray="3,2"/>
  <path d="M250,258 C275,258 275,324 290,324" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="3,2"/>

  <!-- Cruces técnicas de esquina inferior -->
  <text x="0" y="360" font-size="11" fill="#141414" font-weight="bold">+</text>
  <text x="810" y="360" font-size="11" fill="#141414" font-weight="bold" text-anchor="end">+</text>

  <!-- Línea divisoria inferior -->
  <line x1="10" y1="365" x2="810" y2="365" stroke="#141414" stroke-width="1"/>

  <!-- Leyenda inferior -->
  <text x="10" y="385" font-size="9" fill="#141414" font-weight="bold">LEYENDA:</text>
  <line x1="70" y1="382" x2="100" y2="382" stroke="#141414" stroke-width="1"/>
  <polygon points="100,382 96,379 96,385" fill="#141414"/>
  <text x="106" y="385" font-size="8" fill="#888">vinculación directa</text>

  <line x1="210" y1="382" x2="240" y2="382" stroke="#9e2a2b" stroke-width="0.75" stroke-dasharray="3,2"/>
  <text x="246" y="385" font-size="8" fill="#888">adaptabilidad cruzada</text>

  <text x="360" y="386" font-size="10" fill="#9e2a2b">❋</text>
  <text x="376" y="385" font-size="8" fill="#888">nodo de transición</text>

  <!-- Sello -->
  <text x="810" y="385" font-size="9" fill="#141414" text-anchor="end" font-weight="bold">[REV-03] FADU DG4</text>

  <!-- Nota técnica pie -->
  <text x="10" y="408" font-size="8" fill="#888">// Las relaciones urbanas se validan según planes directores de arbolado municipal vigentes.</text>

  <!-- Cruces + fila de ticks -->
  <text x="10" y="425" font-size="8" fill="#141414" letter-spacing="8">+ · + · + · + · + · + · + · + · + · + · + · + · + · + · + · + · + · + · + · +</text>

