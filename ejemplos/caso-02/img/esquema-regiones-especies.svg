<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%" style="background:#fbfaf6; font-family:'SF Mono',Consolas,monospace;">
  <defs>
    <linearGradient id="humedadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#777770" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d0cebd" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Marco exterior -->
  <rect x="15" y="15" width="770" height="410" fill="none" stroke="#141414" stroke-width="1"/>
  
  <!-- Cabezal técnico interno -->
  <text x="30" y="40" font-size="11" fill="#141414" font-weight="bold" letter-spacing="1">ESQUEMA DE RELACIONES // REGIONES ➔ ESPECIES ➔ USOS URBANOS</text>
  <text x="730" y="40" font-size="11" fill="#888" text-anchor="end">[REV-02]</text>
  <line x1="15" y1="50" x2="785" y2="50" stroke="#141414" stroke-width="1"/>
  
  <!-- Barra de gradiente de humedad -->
  <text x="30" y="72" font-size="10" font-weight="bold" fill="#141414">GRADIENTE DE HUMEDAD:</text>
  <text x="210" y="72" font-size="9" fill="#141414">+ NORESTE HÚMEDO (SELVA)</text>
  <text x="730" y="72" font-size="9" fill="#555" text-anchor="end">SUDOESTE SECO (ESTEPA/BOSQUE FRÍO) -</text>
  
  <rect x="30" y="78" width="740" height="12" fill="url(#humedadGrad)" stroke="#141414" stroke-width="1"/>
  
  <!-- 3 Columnas principales -->
  <!-- Columna 1: Regiones -->
  <rect x="30" y="110" width="220" height="28" fill="#eceae1" stroke="#141414" stroke-width="1"/>
  <text x="40" y="128" font-size="11" font-weight="bold" fill="#141414">01 // REGIÓN</text>
  
  <!-- Columna 2: Especies -->
  <rect x="290" y="110" width="220" height="28" fill="#eceae1" stroke="#141414" stroke-width="1"/>
  <text x="300" y="128" font-size="11" font-weight="bold" fill="#141414">02 // ESPECIE NATIVA</text>
  
  <!-- Columna 3: Usos Urbanos -->
  <rect x="550" y="110" width="220" height="28" fill="#eceae1" stroke="#141414" stroke-width="1"/>
  <text x="560" y="128" font-size="11" font-weight="bold" fill="#141414">03 // USO URBANO</text>

  <!-- Fila 1: Selva Paranaense -> Lapacho -> Avenidas -->
  <rect x="30" y="150" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="40" y="173" font-size="11" fill="#141414">Selva Paranaense</text>
  
  <rect x="290" y="150" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="300" y="173" font-size="11" fill="#141414">Lapacho rosado</text>
  
  <rect x="550" y="150" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="560" y="173" font-size="11" fill="#141414">Avenidas / Plazas</text>
  
  <line x1="250" y1="169" x2="290" y2="169" stroke="#141414" stroke-width="1"/>
  <line x1="510" y1="169" x2="550" y2="169" stroke="#141414" stroke-width="1"/>

  <!-- Fila 2: Espinal / Pampeana -> Tala y Ceibo -> Veredas / Riberas -->
  <rect x="30" y="200" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="40" y="223" font-size="11" fill="#141414">Espinal / Pampeana</text>
  
  <rect x="290" y="200" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="300" y="223" font-size="11" fill="#141414">Ceibo / Tala</text>
  
  <rect x="550" y="200" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="560" y="223" font-size="11" fill="#141414">Costaneras / Veredas</text>
  
  <line x1="250" y1="219" x2="290" y2="219" stroke="#141414" stroke-width="1"/>
  <line x1="510" y1="219" x2="550" y2="219" stroke="#141414" stroke-width="1"/>

  <!-- Fila 3: Chaco / Monte -> Algarrobo -> Zonas Áridas -->
  <rect x="30" y="250" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="40" y="273" font-size="11" fill="#141414">Chaco / Monte árido</text>
  
  <rect x="290" y="250" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="300" y="273" font-size="11" fill="#141414">Algarrobo blanco/negro</text>
  
  <rect x="550" y="250" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="560" y="273" font-size="11" fill="#141414">Bajo riego / Sombra estival</text>
  
  <line x1="250" y1="269" x2="290" y2="269" stroke="#141414" stroke-width="1"/>
  <line x1="510" y1="269" x2="550" y2="269" stroke="#141414" stroke-width="1"/>

  <!-- Fila 4: Bosques Patagónicos -> Pehuén -> Parques Fríos -->
  <rect x="30" y="300" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="40" y="323" font-size="11" fill="#141414">Bosques Patagónicos</text>
  
  <rect x="290" y="300" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="300" y="323" font-size="11" fill="#141414">Pehuén (Araucaria)</text>
  
  <rect x="550" y="300" width="220" height="38" fill="#fff" stroke="#141414" stroke-width="1"/>
  <text x="560" y="323" font-size="11" fill="#141414">Hitos cívicos / Aislamiento</text>
  
  <line x1="250" y1="319" x2="290" y2="319" stroke="#141414" stroke-width="1"/>
  <line x1="510" y1="319" x2="550" y2="319" stroke="#141414" stroke-width="1"/>

  <!-- Cruces de conexión cruzada técnicas -->
  <path d="M250,219 C270,219 270,169 290,169" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="2,2"/>
  <path d="M510,219 C530,219 530,269 550,269" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="2,2"/>
  
  <!-- Pie del diagrama -->
  <line x1="15" y1="365" x2="785" y2="365" stroke="#141414" stroke-width="1"/>
  <text x="30" y="392" font-size="10" fill="#555">// NOTA DE RELEVAMIENTO: LAS RELACIONES URBANAS SE VALIDADOS SEGÚN PLANES DIRECTORES DE ARBOLADO.</text>
  <text x="730" y="392" font-size="10" fill="#141414" text-anchor="end" font-weight="bold">FADU DG4</text>
</svg>
